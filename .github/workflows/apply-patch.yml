name: Terapkan patch UI
on:
  push:
    paths: ['patches-ui/*.patch']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Terapkan patch lalu hapus berkasnya
        id: terapkan
        run: |
          mkdir -p patches-ui/.applied
          gagal=0
          for p in patches-ui/*.patch; do
            [ -e "$p" ] || continue
            n=$(basename "$p")
            echo "== $n"
            if [ -f "patches-ui/.applied/$n" ]; then
              echo "Sudah pernah diterapkan. Berkas dihapus."
              rm -f "$p"
              continue
            fi
            if patch -p1 -N --dry-run --no-backup-if-mismatch < "$p" > /tmp/uji.log 2>&1; then
              patch -p1 -N --no-backup-if-mismatch < "$p"
              echo "Berhasil diterapkan. Berkas dihapus."
              rm -f "$p"
            elif patch -p1 -R --dry-run --no-backup-if-mismatch < "$p" > /dev/null 2>&1; then
              echo "Isi patch ini sudah ada di kode. Berkas dihapus."
              rm -f "$p"
            else
              cat /tmp/uji.log
              echo "::error::$n tidak bisa diterapkan dengan bersih, jadi tidak ada yang diubah. Berkasnya dibiarkan agar bisa dicek."
              gagal=1
              break
            fi
          done
          find . \( -name '*.rej' -o -name '*.orig' \) -not -path './node_modules/*' -delete
          rm -rf patches-ui/.applied
          touch patches-ui/.gitkeep
          echo "gagal=$gagal" >> "$GITHUB_OUTPUT"

      - name: Commit, dorong, dan jalankan build
        env:
          GH_TOKEN: ${{ github.token }}
          GAGAL: ${{ steps.terapkan.outputs.gagal }}
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan"
          else
            git commit -m "Terapkan patch UI"
            git push
            if [ "$GAGAL" = "0" ]; then
              gh workflow run main.yml
            else
              echo "::warning::Build tidak dijalankan karena ada patch yang gagal."
            fi
          fi
          if [ "$GAGAL" != "0" ]; then
            exit 1
          fi
